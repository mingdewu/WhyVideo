  <!-- 最终渲染确认弹窗 -->
  <div id="artTextPanel" onclick="if(event.target===this) openArtTextPanel()" class="studio-modal fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5 hidden" role="dialog" aria-modal="true" aria-labelledby="artTextTitle">
    <section class="w-full max-w-5xl max-h-[90vh] flex flex-col rounded-2xl border border-fuchsia-700/50 bg-gray-900 shadow-2xl overflow-hidden">
      <div class="flex items-start justify-between gap-4 p-5 border-b border-gray-700"><div><h2 id="artTextTitle" class="text-lg font-bold text-fuchsia-200">✨ AI 重点艺术字</h2><p class="text-xs text-gray-400 mt-1">AI 结合全文与创意要求设计文字、排版、颜色和关键帧动作。时间为估算，请结合旁白检查。</p></div><button type="button" onclick="openArtTextPanel()" aria-label="关闭艺术字弹窗" class="text-gray-400 hover:text-white text-xl px-2">✕</button></div>
      <div class="p-5 overflow-y-auto space-y-3"><label class="block text-xs text-gray-300">本次创意要求（选填）<textarea id="artCreativeRequest" rows="2" maxlength="1000" class="block w-full mt-1 p-2 rounded-lg bg-gray-950 border border-gray-700 text-white" placeholder="例如：电影预告片风格，关键数据从远处飞入，颜色与旁白情绪呼应"></textarea></label><p class="text-xs text-gray-400">完整提示词可在右上角「提示词设置 → 7. AI 重点艺术字」中查看和修改。</p><div class="flex flex-wrap items-center gap-3"><button id="artGenerateBtn" type="button" onclick="generateArtText()" class="px-3 py-2 rounded-lg bg-fuchsia-700 hover:bg-fuchsia-600 text-white text-xs font-bold">生成提案</button><p id="artTextStatus" class="text-xs text-gray-300" aria-live="polite">先生成提案，再修改文字、动画和时间。</p></div><div id="artTextItems" class="space-y-2"></div></div>
      <div class="p-4 border-t border-gray-700 flex justify-end gap-2"><button type="button" onclick="openArtTextPanel()" class="px-3 py-2 rounded-lg bg-gray-700 text-white text-xs">关闭</button><button id="artApplyBtn" type="button" onclick="applyArtText()" class="hidden px-3 py-2 rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold">应用所选并同步 Remotion</button></div>
    </section>
  </div>

        <button type="button" id="confirmStartFinalRenderBtn" onclick="confirmStartFinalRender()" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg transition cursor-pointer">
