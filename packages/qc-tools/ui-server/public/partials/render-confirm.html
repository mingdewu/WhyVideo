  <!-- 最终渲染确认弹窗 -->
  <div id="artTextPanel" onclick="if(event.target===this) openArtTextPanel()" class="studio-modal fixed inset-0 bg-backdrop backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5 hidden" role="dialog" aria-modal="true" aria-labelledby="artTextTitle">
    <section class="w-full max-w-5xl max-h-[90vh] flex flex-col rounded-2xl border border-accent-line bg-surface shadow-2xl overflow-hidden">
      <div class="flex items-start justify-between gap-4 p-5 border-b border-line"><div><h2 id="artTextTitle" class="text-lg font-bold text-accent">✨ AI 重点艺术字</h2><p class="text-xs text-ink-muted mt-1">AI 结合全文与创意要求设计文字、排版、颜色和关键帧动作。时间为估算，请结合旁白检查。</p></div><button type="button" onclick="openArtTextPanel()" aria-label="关闭艺术字弹窗" class="text-ink-muted hover:text-ink text-xl px-2">✕</button></div>
      <div class="p-5 overflow-y-auto space-y-3"><label class="block text-xs text-ink-secondary">本次创意要求（选填）<textarea id="artCreativeRequest" rows="2" maxlength="1000" class="block w-full mt-1 p-2 rounded-lg bg-input border border-line text-ink" placeholder="例如：电影预告片风格，关键数据从远处飞入，颜色与旁白情绪呼应"></textarea></label><p class="text-xs text-ink-muted">完整提示词可在右上角「提示词设置 → 7. AI 重点艺术字」中查看和修改。</p><div class="flex flex-wrap items-center gap-3"><button id="artGenerateBtn" type="button" onclick="generateArtText()" class="px-3 py-2 rounded-lg bg-action hover:bg-action-hover text-ink-inverse text-xs font-bold">生成提案</button><p id="artTextStatus" class="text-xs text-ink-secondary" aria-live="polite">先生成提案，再修改文字、动画和时间。</p></div><div id="artTextItems" class="space-y-2"></div></div>
      <div class="p-4 border-t border-line flex justify-end gap-2"><button type="button" onclick="openArtTextPanel()" class="px-3 py-2 rounded-lg bg-muted text-ink text-xs">关闭</button><button id="artApplyBtn" type="button" onclick="applyArtText()" class="hidden px-3 py-2 rounded-lg bg-ok-solid hover:bg-ok-hover text-ink-inverse text-xs font-bold">应用所选并同步 Remotion</button></div>
    </section>
  </div>

  <div id="finalRenderConfirmModal" onclick="if(event.target===this) closeFinalRenderConfirmModal()" class="studio-modal fixed inset-0 bg-backdrop backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="finalRenderConfirmTitle">
    <div class="card w-full max-w-md p-5 rounded-2xl border border-ok-line shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-2.5 border-b border-line">
        <h3 id="finalRenderConfirmTitle" class="text-base font-black text-ink flex items-center gap-2">
          🎬 确认开始最终渲染
        </h3>
        <button type="button" onclick="closeFinalRenderConfirmModal()" class="w-8 h-8 rounded-lg bg-surface hover:bg-muted text-ink-muted hover:text-ink flex items-center justify-center transition cursor-pointer" aria-label="关闭">✕</button>
      </div>

      <div class="space-y-2.5 text-xs text-ink-secondary">
        <div class="p-3 rounded-xl bg-subtle border border-line space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-ink-muted">当前工程</span>
            <span id="finalRenderProjectName" class="font-bold text-warn truncate">-</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="text-ink-muted">镜头规模</span>
            <span id="finalRenderSceneSummary" class="font-semibold text-ink">-</span>
          </div>
        </div>
        <label for="finalRenderBurnCaptions" class="flex items-start gap-2.5 p-3 rounded-xl bg-subtle border border-line hover:border-accent-line transition cursor-pointer select-none">
          <input id="finalRenderBurnCaptions" type="checkbox" checked class="mt-0.5 rounded border-line text-ok-solid focus:ring-ok-solid cursor-pointer" />
          <span class="space-y-0.5">
            <span class="block text-xs font-bold text-ink">烧录中文字幕到视频画面（原版底部字幕样式）</span>
            <span class="block text-[11px] text-ink-muted leading-relaxed">勾选后将把工程中文字幕直接渲染进 MP4 画面；若取消勾选则输出无字幕纯净画面（适合仅使用 YouTube 多语言软字幕轨）。</span>
          </span>
        </label>
        <p class="text-[11px] text-ink-muted leading-relaxed">
          将使用当前已保存的镜头配置、配音及 BGM 进行 1080p 后台渲染。渲染期间切换工程或刷新页面不会中断任务。
        </p>
      </div>

      <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-line">
        <button type="button" onclick="closeFinalRenderConfirmModal()" class="px-3.5 py-1.5 rounded-xl bg-surface hover:bg-muted text-ink-secondary border border-line text-xs font-bold transition cursor-pointer">
          取消
        </button>
        <button type="button" id="confirmStartFinalRenderBtn" onclick="confirmStartFinalRender()" class="px-4 py-1.5 rounded-xl bg-ok-solid hover:bg-ok-hover text-ink-inverse text-xs font-bold shadow-lg transition cursor-pointer">
          🚀 确认并开始渲染
        </button>
      </div>
    </div>
  </div>
